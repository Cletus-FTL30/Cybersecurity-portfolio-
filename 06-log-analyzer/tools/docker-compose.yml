# ELK lab stack for Project 6 — Log Analyzer (tools version)
# Single-node Elasticsearch + Kibana + Filebeat.
# Security is disabled ON PURPOSE — this is a throwaway lab on a host I own
# (Cletus-lab, 192.168.0.240). NEVER run a cluster like this in production.
#
#   docker compose up -d
#   docker compose run --rm filebeat setup -e   # one-off: load dashboards/pipelines
#
# Filebeat reads the SAME sample logs the Python analyzer parses
# (../python/samples), so both tools detect the same attacks.

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g          # keep the lab VM happy
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
    ports:
      - "5601:5601"
    depends_on:
      es:
        condition: service_healthy

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    container_name: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../python/samples:/logs:ro          # the embedded-attack sample logs
    depends_on:
      es:
        condition: service_healthy
